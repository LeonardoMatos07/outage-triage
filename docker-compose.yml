services:
  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      LLM_MODE: ${LLM_MODE:-real}
    ports:
      - "8000:8000"

  ui:
    build: .
    command: streamlit run ui/chat.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    environment:
      API_URL: http://api:8000
      LLM_MODE: ${LLM_MODE:-real}
    ports:
      - "8501:8501"
    depends_on:
      - api

  dashboard:
    build: .
    command: streamlit run ui/dashboard.py --server.port 8502 --server.address 0.0.0.0
    environment:
      LLM_MODE: ${LLM_MODE:-real}
    volumes:
      - ./reports:/srv/reports:ro
    ports:
      - "8502:8502"
