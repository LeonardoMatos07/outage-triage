[browser]
gatherUsageStats = false

[theme]
font = "sans-serif"
baseRadius = "0.75rem"

[theme.light]
primaryColor = "#256abf"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#efeeea"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#2c2c2a"
